name: aivista-ci
on:
  push:
    paths:
      - 'aivista/**'
      - '.github/workflows/aivista-ci.yml'
  pull_request:
    paths:
      - 'aivista/**'
      - '.github/workflows/aivista-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aivista
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t aivista:ci .
