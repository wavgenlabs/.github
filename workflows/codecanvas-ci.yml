name: codecanvas-ci
on:
  push:
    paths:
      - 'codecanvas/**'
      - '.github/workflows/codecanvas-ci.yml'
  pull_request:
    paths:
      - 'codecanvas/**'
      - '.github/workflows/codecanvas-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codecanvas
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t codecanvas:ci .
