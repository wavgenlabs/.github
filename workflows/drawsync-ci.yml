name: drawsync-ci
on:
  push:
    paths:
      - 'drawsync/**'
      - '.github/workflows/drawsync-ci.yml'
  pull_request:
    paths:
      - 'drawsync/**'
      - '.github/workflows/drawsync-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drawsync
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t drawsync:ci .
