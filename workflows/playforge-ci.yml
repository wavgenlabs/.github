name: playforge-ci
on:
  push:
    paths:
      - 'playforge/**'
      - '.github/workflows/playforge-ci.yml'
  pull_request:
    paths:
      - 'playforge/**'
      - '.github/workflows/playforge-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playforge
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t playforge:ci .
