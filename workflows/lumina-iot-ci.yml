name: lumina-iot-ci
on:
  push:
    paths:
      - 'lumina-iot/**'
      - '.github/workflows/lumina-iot-ci.yml'
  pull_request:
    paths:
      - 'lumina-iot/**'
      - '.github/workflows/lumina-iot-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumina-iot
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t lumina-iot:ci .
